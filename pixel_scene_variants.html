<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel scene variants</title>
<style>
:root{--bg:#101319;--card:#181c23;--border:#272d37;--text:#e7ebf1;--muted:#98a2b3}
*{box-sizing:border-box}
body{margin:0;padding:28px 24px 60px;background:var(--bg);color:var(--text);
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
p.sub{margin:0;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 20px}
button{background:#212832;color:var(--text);border:1px solid var(--border);border-radius:8px;
 padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#3b4553}
label{color:var(--muted);display:flex;align-items:center;gap:8px;font-size:13px}
input[type=range]{width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px}
.cap b{font-weight:600;font-size:13px}
.cap span{color:var(--muted);font-size:12px;text-align:right}
.new{color:#7fe6d8}
</style>
</head>
<body>
<div class="wrap">
<h1>Pixel scene variants</h1>
<p class="sub">Same two computers from the panel, dropped into new settings. Click a scene to make them cheer; move the mouse over one and they follow the cursor.</p>

<div class="bar">
  <button id="pp">Pause</button>
  <button id="cheer">Cheer everyone</button>
  <label>Pixel size <input type="range" id="res" min="180" max="320" step="20" value="240"></label>
</div>

<div class="grid" id="grid"></div>
</div>

function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;var r=Math.imul(a^a>>>15,1|a);
 r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function circ(cx,cy,r,c){g.fillStyle=c;for(var d=-r;d<=r;d++){var w=Math.floor(Math.sqrt(Math.max(0,r*r-d*d)));
 g.fillRect(Math.round(cx-w),Math.round(cy+d),w*2+1,1)}}
function rr(x,y,w,h,rad,c){g.fillStyle=c;for(var i=0;i<h;i++){var ins=0,k;
 if(i<rad){k=rad-i-0.5;ins=rad-Math.floor(Math.sqrt(Math.max(0,rad*rad-k*k)))}
 var b=h-1-i;if(b<rad){k=rad-b-0.5;ins=Math.max(ins,rad-Math.floor(Math.sqrt(Math.max(0,rad*rad-k*k))))}
 g.fillRect(Math.round(x+ins),Math.round(y+i),Math.max(1,Math.round(w-2*ins)),1)}}
function poly(p,c){var ys=p.map(function(q){return q[1]}),a=Math.min.apply(0,ys),b=Math.max.apply(0,ys);g.fillStyle=c;
 for(var y=Math.floor(a);y<=b;y++){var xs=[];
  for(var i=0;i<p.length;i++){var u=p[i],v=p[(i+1)%p.length];
   if((u[1]<=y&&v[1]>y)||(v[1]<=y&&u[1]>y))xs.push(u[0]+(y-u[1])/(v[1]-u[1])*(v[0]-u[0]))}
  xs.sort(function(m,n){return m-n});
  for(var i=0;i+1<xs.length;i+=2)g.fillRect(Math.round(xs[i]),y,Math.max(1,Math.round(xs[i+1]-xs[i])),1)}}

/* ---------- per-scene build ---------- */
function build(s){
 var P=s.def,Wd=W,Hd=H;GY=Math.round(H*0.74);
 s.sky=document.createElement('canvas');s.sky.width=W;s.sky.height=H;
 var sg=s.sky.getContext('2d');sg.imageSmoothingEnabled=false;
 var img=sg.createImageData(W,H),d=img.data,bay=[[0,2],[3,1]],hz=Hd*0.78;
 for(var y=0;y<H;y++){var f=Math.min(1,y/hz);
  for(var x=0;x<W;x++){var dd=(bay[y&1][x&1]/4-0.375)*26,o=(y*W+x)*4;
   for(var i=0;i<3;i++){var v=P.sky[0][i]+(P.sky[1][i]-P.sky[0][i])*f+dd;
    d[o+i]=Math.max(0,Math.min(255,Math.round(v/17)*17))}
   d[o+3]=255}}
 sg.putImageData(img,0,0);
 var prev=g;g=sg;
 if(P.stars){var q=rnd(5);for(var i=0;i<90;i++){var sx=Math.floor(q()*W),sy=Math.floor(q()*H*0.72);
  g.globalAlpha=0.35+q()*0.65;R(sx,sy,1,1,'#ffffff')}g.globalAlpha=1}
 if(P.sun)circ(W*0.24,H*0.30,Math.round(H*0.11),'#fff0c0');
 if(P.mode==='space')planet(W*0.76,H*0.24,Math.round(H*0.13));
 if(P.moons){circ(W*0.70,H*0.17,4,'#cbb6a4');circ(W*0.70-1,H*0.17-1,2,'#e0cec0');
  circ(W*0.87,H*0.30,2,'#bda694')}
 if(P.bigsun){var ux=W*0.30,uy=H*0.62;circ(ux,uy,Math.round(H*0.13),'#ffdca0');
  circ(ux,uy,Math.round(H*0.10),'#fff0cc');
  for(var i=0;i<5;i++)R(ux-H*0.14,uy-H*0.11+i*Math.round(H*0.055),Math.round(H*0.28),1,P.sky[1]?'#f6c68c':'#f6c68c')}
 bakeGround(s);
 g=prev;

 var P2=P,r=rnd(P.mode==='sea'?13:7);
 s.clouds=[];
 for(var i=0;i<P.nC;i++){var n=5+Math.floor(r()*4),b=[],sp=Wd*(0.14+r()*0.13);
  for(var j=0;j<n;j++)b.push([(j/(n-1)-0.5)*sp,(r()-0.5)*Hd*0.05,Hd*(0.05+r()*0.06)]);
  s.clouds.push({x:r()*Wd*1.4-Wd*0.2,y:Hd*(0.08+r()*0.26),b:b,s:0.05+r()*0.08})}

 s.bushes=[];
 function mass(x0,x1,y0,y1,n,seed){var p=rnd(seed);for(var i=0;i<n;i++){
  var px=x0+p()*(x1-x0),py=y0+p()*(y1-y0),rad=Hd*(0.035+p()*0.06);
  s.bushes.push({x:px,y:py,r:rad,dark:p()<0.45,ph:p()*6.28,f:p()<0.5?[px+(p()-0.5)*rad,py-rad*0.55]:null})}}
 if(P.mode==='land'||P.mode==='snow'){
  mass(-Wd*0.04,Wd*0.30,Hd*0.55,Hd*0.76,26,3);mass(Wd*0.70,Wd*1.04,Hd*0.52,Hd*0.74,24,9);
  mass(-Wd*0.04,Wd*1.04,Hd*0.78,Hd*1.02,38,15)}
 if(P.mode==='sea'){mass(-Wd*0.04,Wd*0.28,Hd*0.60,Hd*0.76,10,3);mass(Wd*0.74,Wd*1.04,Hd*0.58,Hd*0.76,10,9);
  mass(-Wd*0.04,Wd*1.04,Hd*0.80,Hd*1.00,14,15)}

 s.blades=[];
 if(P.plants==='grass'||P.plants==='weed'){
  var r3=rnd(33),nb=Math.round(Wd*(P.plants==='weed'?0.16:0.62));
  for(var i=0;i<nb;i++)s.blades.push({x:r3()*Wd,
   y:P.plants==='weed'?Hd*(0.80+r3()*0.18):Hd*(0.80+r3()*0.22),
   h:P.plants==='weed'?Hd*(0.10+r3()*0.22):Hd*(0.03+r3()*0.07),ph:r3()*6.28,c:r3()<0.35})}
 if(P.plants==='cactus'){var rc=rnd(23);s.cacti=[];
  for(var i=0;i<5;i++){var cx=(0.06+i*0.21+rc()*0.05)*Wd;
   if(Math.abs(cx-Wd/2)<Wd*0.14)cx+=Wd*0.2;
   s.cacti.push({x:cx,y:Hd*(0.78+rc()*0.16),h:Hd*(0.10+rc()*0.10),arm:rc()<0.7,fl:rc()<0.5})}}

 var r4=rnd(41);s.motes=[];
 for(var i=0;i<16;i++)s.motes.push({x:r4()*Wd,y:r4()*Hd,ph:r4()*6.28,sp:0.06+r4()*0.12});
 var r5=rnd(51);s.twk=[];
 for(var i=0;i<12;i++)s.twk.push({x:Math.floor(r5()*Wd),y:Math.floor(r5()*Hd*0.6),ph:r5()*6.28});
 var r6=rnd(61);s.gulls=[];
 for(var i=0;i<3;i++)s.gulls.push({x:r6()*Wd,y:Hd*(0.10+r6()*0.18),sp:0.14+r6()*0.1,ph:r6()*6.28});
 var r7=rnd(71);s.drops=[];
 for(var i=0;i<Math.round(Wd*0.4);i++)s.drops.push({x:r7()*Wd,y:r7()*Hd,sp:2.4+r7()*1.8,len:3+Math.floor(r7()*4)});
 s.splash=[];for(var i=0;i<10;i++)s.splash.push({x:r7()*Wd,y:GY+r7()*(Hd-GY),ph:r7()*6.28});
 var r8=rnd(83);s.flakes=[];
 for(var i=0;i<Math.round(Wd*0.32);i++)s.flakes.push({x:r8()*Wd,y:r8()*Hd,sp:0.25+r8()*0.5,ph:r8()*6.28,big:r8()<0.28});
 var r9=rnd(89);s.leaves=[];
 for(var i=0;i<26;i++)s.leaves.push({x:r9()*Wd,y:r9()*Hd,sp:0.35+r9()*0.5,ph:r9()*6.28,c:r9()});
 var ra=rnd(95);s.fish=[];
 for(var i=0;i<7;i++)s.fish.push({x:ra()*Wd,y:Hd*(0.18+ra()*0.5),sp:(ra()<0.5?-1:1)*(0.25+ra()*0.4),
  ph:ra()*6.28,c:ra()});
 s.bub=[];for(var i=0;i<22;i++)s.bub.push({x:ra()*Wd,y:ra()*Hd,sp:0.3+ra()*0.5,ph:ra()*6.28,big:ra()<0.3});
 s.rocksF=[[[0.01,0.66],[0.06,0.58],[0.12,0.66],[0.11,0.78],[0.02,0.78]],
           [[0.86,0.80],[0.93,0.74],[1.00,0.81],[0.99,0.92],[0.87,0.91]],
           [[0.14,0.84],[0.20,0.79],[0.25,0.87],[0.19,0.93],[0.12,0.91]]];
}

function planet(cx,cy,r){
 for(var dy=-r;dy<=r;dy++){var w=Math.floor(Math.sqrt(r*r-dy*dy));
  R(cx-w,cy+dy,w*2+1,1,'#2f63a4');
  R(cx+w-Math.round(w*0.5),cy+dy,Math.round(w*0.5)+1,1,'#22497b')}
 circ(cx-r*0.25,cy-r*0.2,Math.round(r*0.34),'#3f8b57');
 circ(cx+r*0.1,cy+r*0.35,Math.round(r*0.26),'#3f8b57');

 cv.addEventListener('mousemove',function(e){var b=cv.getBoundingClientRect();
  sc.look={x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}});
 cv.addEventListener('mouseleave',function(){sc.look=null});
 live.push(sc);
 if('IntersectionObserver' in window){
  new IntersectionObserver(function(en){sc.vis=en[0].isIntersecting},{rootMargin:'120px'}).observe(cv)}
});

function sizeAll(w){W=w;H=Math.round(w*10/16);
 live.forEach(function(s){s.cv.width=W;s.cv.height=H;s.g.imageSmoothingEnabled=false;build(s);frame(s)})}

function loop(ts){if(!last)last=ts;var dt=(ts-last)/1000;last=ts;
 if(run){acc+=dt;if(acc>1/18){t+=acc;acc=0;live.forEach(function(s){if(s.vis)frame(s)})}}
 requestAnimationFrame(loop)}

document.getElementById('pp').onclick=function(){run=!run;this.textContent=run?'Pause':'Play'};
document.getElementById('cheer').onclick=function(){live.forEach(function(s){s.joyAt=t})};
document.getElementById('res').oninput=function(){sizeAll(parseInt(this.value,10))};
sizeAll(240);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
