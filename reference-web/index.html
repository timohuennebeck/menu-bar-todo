<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Bar To-Do</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="screen">
      <div class="menubar">
        <button class="menubar-btn" id="menubar-toggle" type="button" title="To-Do ein-/ausblenden" aria-label="To-Do ein-/ausblenden" aria-expanded="true">
          <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M4.5 4h8M4.5 7.5h8M4.5 11h8" fill="none" stroke="#1D1D1F" stroke-width="1.4" stroke-linecap="round"></path><circle cx="2.2" cy="4" r="1" fill="#1D1D1F"></circle><circle cx="2.2" cy="7.5" r="1" fill="#1D1D1F"></circle><circle cx="2.2" cy="11" r="1" fill="#1D1D1F"></circle></svg>
        </button>
        <span class="clock" id="clock"></span>
      </div>
      <div id="panel-slot"></div>
    </div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
